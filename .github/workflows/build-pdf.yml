name: Build PDF

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-pictures

      - name: Build PDF
        run: latexmk -pdf -interaction=nonstopmode -halt-on-error -file-line-error higher-coherences.tex

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: higher-coherences-pdf
          path: higher-coherences.pdf
          if-no-files-found: error


name: Build PDF

on:
  push:
    paths:
      - "**/*.tex"
      - "**/*.bib"
      - "**/*.cls"
      - "**/*.sty"
      - "Makefile"
      - ".github/workflows/build-pdf.yml"
  pull_request:
    paths:
      - "**/*.tex"
      - "**/*.bib"
      - "**/*.cls"
      - "**/*.sty"
      - "Makefile"
      - ".github/workflows/build-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk \
            texlive-fonts-recommended \
            texlive-latex-extra \
            texlive-latex-recommended \
            texlive-pictures

      - name: Build PDF
        run: make

      - name: Upload PDF
        uses: actions/upload-artifact@v7
        with:
          path: higher-coherences.pdf
          if-no-files-found: error
          archive: false
